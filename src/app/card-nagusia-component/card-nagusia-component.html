<div class="container" id="wrapper">
    <div class="container-fluid" id="current-weather">
        <div class="row">

            <!-- Right panel -->
            <div class="col-md-4 col-sm-5">
                <h5><span id="cityName">{{hiria}}</span> <span
                        id="cityCode"></span></h5>
                <h6 id="localDate"></h6>
                <h5 id="localTime"></h5>
                <a id="refreshButton" href="#"><i class="fa fa-refresh fa-fw"
                        aria-hidden="true"></i> Refresh</a>
            </div>

            <!-- Center panel -->
            <div class="col-md-5 col-sm-7" style="margin: 10px auto;padding:0;">
                <div class="row">
                    <i class="wi" id="main-icon" style="font-size: 85px;"></i>
                    <div>
                        <span id="mainTemperature"></span>
                        <p id="tempDescription"></p>
                    </div>
                    <p style="font-size: 1.5rem;"><a href="#" class="active"
                            id="celcius">°C</a>
                </div>
            </div>

            <!-- Left panel -->
            <div class="col-xs-12 col-sm-12 col-md-3 row"
                style="text-align: right;">
                <div class="col-md-12 col-sm-3 col-xs-3 side-weather-info">
                    <h6>Humidity: <span id="humidity"></span>%</h6>
                </div>
                <div class="col-md-12 col-sm-3 col-xs-3 side-weather-info">
                    <h6>Wind: <span id="wind"></span> m/s</h6>
                </div>
                <div class="col-md-12 col-sm-3 col-xs-3 side-weather-info">
                    <h6>High: <span id="mainTempHot"></span>°</h6>
                </div>
                <div class="col-md-12 col-sm-3 col-xs-3 side-weather-info">
                    <h6>Low: <span id="mainTempLow"></span>°</h6>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="protocol-modal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"
                        aria-label="Close"><span
                            aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <p>Due to weather api restrictions, data can only be shown
                        via HTTP request.</p>
                    <p>Sorry for the inconvenience.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default"
                        data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

</div>
