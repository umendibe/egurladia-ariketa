<header class="container mt-4">
    <h1 class="text-center my-3">EGURALDIA</h1>

    <div class="row justify-content-center">
        <div class="col-md-4">
            <form class="input-group">
                <span class="input-group-text"><i
                        class="bi bi-search"></i></span>
                <input
                    class="form-control"
                    type="search"
                    name="bilaketa"
                    placeholder="Bilatu herri edo hiri bat..."
                    aria-label="Bilatu herri edo hiri bat"
                    required
                    value="{{ hiria }}">
                <button class="btn btn-primary" type="submit"
                    aria-label="Bilatu">
                    <i class="bi bi-search">Bilatu</i>
                </button>
            </form>
        </div>
    </div>
</header>

<main class="container mt-4">

    @if (location) {
    <app-card-nagusia-component
        [latitude]="getLatitude()" 
        [longitude]="getLongitude()"  
        [hiria]="hiria"> 
    </app-card-nagusia-component> 
    } @else {
    <p>Kargatzen ...</p> 
    }

</main>
